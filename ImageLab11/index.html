<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="spotlight" src="./assets/spotlight/model.dae"></a-asset-item>
      </a-assets>

      <a-sky src="./assets/nightSky.jpg"></a-sky>

    <!-- Stage -->
      <a-box position="0 -1 -8" src="./assets/blackFloor.jpeg" width="40" height="1" depth="25"></a-box>
      <a-box position="0 9 4" src="./assets/glitchyScreen.mp4" width="40" height="19" depth="1"></a-box>
      <a-box position="19.5 9 -20" src="./assets/metal.jpeg" metalness="1" width="1" height="19" depth="1"></a-box>
      <a-box position="-19.5 9 -20" src="./assets/metal.jpeg" metalness="1" width="1" height="19" depth="1"></a-box>
      <!-- Ceiling -->
      <a-box position="19.5 18 -8" src="./assets/metal.jpeg" metalness="1" width="1" height="1" depth="23"></a-box>
      <a-box position="-19.5 18 -8"src="./assets/metal.jpeg" metalness="1"  width="1" height="1" depth="23"></a-box>
      <a-box position="0 18 0" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -4" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -8" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -12" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -12" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -16" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <a-box position="0 18 -20" src="./assets/metal.jpeg" metalness="1" width="38" height="1" depth="1"></a-box>
      <!-- Mic -->
      <a-cone position="0 -0.4 -15" src="./assets/blackPlastic.jpeg" radius-top=".05" radius-bottom=".25" height=".1"></a-cone>
      <a-cylinder position="0 .4 -15" src="./assets/blackPlastic.jpeg" radius=".05" height="1.7"></a-cylinder>
      <a-cylinder position="0 1.25 -15" src="./assets/blackPlastic.jpeg" rotation="75 0 0" radius=".05" height=".5"></a-cylinder>
      <a-sphere position="0 1.32 -14.75" src="./assets/micMaterial.jpeg" radius=".1"></a-sphere>

      <!-- Lights -->
      <a-entity light="type: point; color: #00bbff; intensity: 100" position="0 8.5 0"></a-entity>
      <a-entity light="type: point; color: #00bbff; intensity: 100" position="-10 8.5 0"></a-entity>
      <a-entity light="type: point; color: #00bbff; intensity: 100" position="10 8.5 0"></a-entity>
      <a-entity light="type: spot; color: #fff; angle: 12; intensity: 150" rotation="-55 123 0" position="10 17.5 -20"></a-entity>
      <a-entity light="type: spot; color: #fff; angle: 12; intensity: 150" rotation="-55 -123 0" position="-10 17.5 -20"></a-entity>

      <!-- Arena -->

    </a-scene>
  </body>
</html>
