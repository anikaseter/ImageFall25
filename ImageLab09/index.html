<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Floor -->
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#e0fffe"></a-plane>
      
      <!-- Body -->
      <a-sphere position="0 .5 -4" radius=".75" color="#e0fffe"></a-sphere>
      <a-sphere position="0 1.45 -4" radius=".5" color="#e0fffe"></a-sphere>
      <a-sphere position="0 2 -4" radius=".3" color="#e0fffe"></a-sphere>

      <!-- Right arm -->
      <a-box width=".75" height=".1" depth=".1" position=".6 1.8 -4" rotation="0 0 45" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position=".82 2.1 -4" rotation="0 0 75" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position=".88 2.1 -4" rotation="0 0 45" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position=".89 2.05 -4" rotation="0 0 45" color="#995d12"></a-box>

      <!-- Left arm -->
      <a-box width=".75" height=".1" depth=".1" position="-.6 1.55 -4" rotation="0 0 30" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position="-.86 1.33 -4" rotation="0 0 60" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position="-.93 1.34 -4" rotation="0 0 30" color="#995d12"></a-box>
      <a-box width=".1" height=".04" depth=".04" position="-.94 1.39 -4" rotation="0 0 30" color="#995d12"></a-box>
      
      <!-- Face -->
      <a-cone radius-bottom=".05" radius-top="0" height=".25" position="0 2 -3.6" rotation="90 0 0" color="#ff9d00"></a-cone>
      <a-sphere radius=".05" position="-.15 2.05 -3.73" color="#000000"></a-sphere>
      <a-sphere radius=".05" position=".15 2.05 -3.73" color="#000000"></a-sphere>

      <!-- Buttons -->
      <a-sphere radius=".05" position="0 1.75 -3.6" color="#000000"></a-sphere>
      <a-sphere radius=".05" position="0 1.5 -3.5" color="#000000"></a-sphere>
      <a-sphere radius=".05" position="0 1.25 -3.55" color="#000000"></a-sphere>
      <a-sphere radius=".05" position="0 1 -3.42" color="#000000"></a-sphere>
      <a-sphere radius=".05" position="0 .75 -3.3" color="#000000"></a-sphere>

      <!-- I don't remember OH the hat duh -->
      <a-cylinder radius=".2" position="0 2.4 -4" height=".3" color="#000000"></a-cylinder>
      <a-cylinder radius=".3" position="0 2.25 -4" height=".05" color="#000000"></a-cylinder>

      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: japan; dressingAmount: 50"></a-entity>
    </a-scene>
  </body>
</html>
