<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-sky src="./assets/yuhhhh.jpg" radius="30"></a-sky>
      

      <!-- Boat -->
       <!-- Base -->
      <a-cone position="23 -1 5" src="./assets/wood.jpg" radius-top="5" radius-bottom="2.75" height="1.5"></a-cone>
      <!-- Mast and sail -->
      <a-cylinder position="23 2 5" src="./assets/mastWood.jpg" radius=".1" height="5"></a-cylinder>
      <a-box position="23 3.75 4.75" src="./assets/fabric.jpg" rotation="15 0 0" height="1.25" width="4" depth=".1"></a-box>
      <a-box position="23 2.55 4.75" src="./assets/fabric.jpg" rotation="-15 0 0" height="1.25" width="4" depth=".1"></a-box>
      <!-- Rail -->
       <a-cylinder position="23 0 5" src="./assets/wood.jpg" radius="5" height=".5" open-ended="true" material="side: double"></a-cylinder>

      <!-- Castle -->
      <a-box src="./assets/sandBrick.jpg" position="0 0 -2.5" width="1" height=".5" depth="1"></a-box>
      <a-box src="./assets/sand2.jpg" position="0 .5 -2.5" width=".75" height=".5" depth=".75"></a-box>
      <a-box src="./assets/sand2.jpg" position="-.275 .85 -2.225" width=".2" height=".2" depth=".2"></a-box>
      <a-box src="./assets/sand2.jpg" position=".275 .85 -2.225" width=".2" height=".2" depth=".2"></a-box>
      <a-box src="./assets/sand2.jpg" position="-.275 .85 -2.775" width=".2" height=".2" depth=".2"></a-box>
      <a-box src="./assets/sand2.jpg" position=".275 .85 -2.775" width=".2" height=".2" depth=".2"></a-box>
      <a-box src="./assets/sandBrick.jpg" position="-.85 .125 -3.35" width=".3" height=".75" depth=".3"></a-box>
      <a-box src="./assets/sandBrick.jpg" position=".85 .125 -3.35" width=".3" height=".75" depth=".3"></a-box>
      <a-box src="./assets/sandBrick.jpg" position="-.85 .125 -1.65" width=".3" height=".75" depth=".3"></a-box>
      <a-box src="./assets/sandBrick.jpg" position=".85 .125 -1.65" width=".3" height=".75" depth=".3"></a-box>

      <!-- Something looming in the distance wooooo so spooky scary -->
      <a-cone color="black" position="-10 10 20" rotation="0 0 0" radius-bottom=".01" radius-top="2" segments-radial="3" height="3"></a-cone>
      <a-cylinder color="black" position="-10 5.5 20" height="11" radius=".25"></a-cylinder>
      <!-- Eyes -->
      <a-sphere position="-9.5 10 19.5" radius=".2"></a-sphere>
      <a-sphere position="-10.5 10 19.5" radius=".2"></a-sphere>
      <!-- Arms -->
      <a-cylinder position="-9.25 6.25 20" rotation="0 0 15" radius=".1" height="5" color="black"></a-cylinder>
      <a-cylinder position="-10.75 6.25 20" rotation="0 0 -15" radius=".1" height="5" color="black"></a-cylinder>
      <!-- Leg thingies -->
      <a-cylinder position="-9.85 2.5 19.65" rotation="10 -3 0" color="black" radius=".1" height="5"></a-cylinder>
      <a-cylinder position="-9.2 2.5 20.2" rotation="-5 0 15" color="black" radius=".1" height="5"></a-cylinder>
      <a-cylinder position="-10.7 2.5 20.2" rotation="-5 0 -12" color="black" radius=".1" height="5"></a-cylinder>
      <a-cylinder position="-9.9 2.5 21" rotation="-25 4 0" color="black" radius=".1" height="5"></a-cylinder>
      <a-cylinder position="-11.4 2 21.1" rotation="-35 0 -35" color="black" radius=".1" height="5"></a-cylinder>
      <a-cylinder position="-9 1 20.8" rotation="-35 0 35" color="black" radius=".1" height="3"></a-cylinder>
      
    </a-scene>
  </body>
</html>
